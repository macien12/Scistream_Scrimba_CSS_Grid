<!doctype html>
<html lang="en">
	
	<head>
		<title>SciStream</title>
		<link rel="stylesheet" href="index.css">
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&family=Source+Code+Pro:ital,wght@0,200..900;1,200..900&display=swap"
		rel="stylesheet">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
	</head>

	<body>
		<header class="site-header">
			<h1>PolishCuisine</h1>
		</header>
		<main>
			<a href="/#" 
				class="technology" 
				aria-label="Discover the best dish in Poland">
				<article>
					<img src="images/pierogi.png" 
						alt="Pierogi on a plate">
					<header class="article-header">
						<h2>Pierogi</h2>
						<h3>The best dish we have here in Poland</h3>
					</header>
				</article>
			</a>
			<a href="/#" 
				class="environment" 
				aria-label="Meat and potatoes">
				<article>
					<img src="images/schabowy.png" 
						alt="Schabowy and ziemniaki on plate">
					<header class="article-header">
						<h2>Schabowy and ziemniaki</h2>
						<h3>You should definitely try it!</h3>
					</header>
				</article>
			</a>
			<a href="/#" 
				class="nasa" 
				aria-label="Discover bigos">
				<article>
					<img src="images/bigos.png" 
						alt="Bigos on a plate">
					<header class="article-header">
						<h2>Bigos</h2>
						<h3>You should try it!</h3>
					</header>
				</article>
			</a>
			<a href="/#" 
				class="physics" 
				aria-label="Explore the cosmic food as żurek">
				<article>
					<img src="images/zurek.png" 
						alt="Żurek on a plate">
					<header class="article-header">
						<h2>Żurek</h2>
						<h3>Żurek with kiełbasa, eggs, horseradish, cream.</h3>
					</header>
				</article>
			</a>
			<a href="/#" 
				class="health" 
				aria-label="You should try this, rice, minced meat and cabbage">
				<article>
					<img src="images/golabki.png" 
						alt="A close-up of nanoparticles">
					<header class="article-header">
						<h2>Gołąbki</h2>
						<h3>You should try this, rice, minced meat and cabbage</h3>
					</header>
				</article>
			</a>
		</main>
		<footer>
			<p>&copy; PolishCuisine 2026</p>
		</footer>
	</body>

</html>
